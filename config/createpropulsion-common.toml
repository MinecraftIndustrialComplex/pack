# Pack override. Only the ethanol row of Create Propulsion's fuel table is set here;
# every other key takes the mod's default when the game starts.
#
# Why: this table wins over the JSON in data/createpropulsion/thruster_fuels. burnRate replaces the
# JSON consumption_multiplier and efficiency multiplies thrust. The mod's default for ethanol is
# 70 / 140, which hid the JSON values. Efficiency 100 and burnRate 120 let
# kubejs/data/createpropulsion/thruster_fuels/cdg/cdg_ethanol.json (thrust 0.8, consumption 1.2)
# mean what it says: 0.667 thrust per mB, 0.60 of the pack's diesel, as real ethanol is 0.594 of
# diesel by volume (US DOE AFDC lower heating values, 76,330 / 128,488 Btu per gallon).
# The liquid burner reads the same JSON thrust and this burn rate, so keep them equal.
["Fuel Configuration".fuelProperties.createdieselgenerators_ethanol]
	efficiency = 100
	burnRate = 120
