# Pack override. Only the rows below are set; every other key takes the mod's default at game start.
#
# Why: this table wins over the JSON in data/createpropulsion/thruster_fuels. burnRate replaces the
# JSON consumption_multiplier and efficiency multiplies thrust. The mod's defaults hid the JSON
# values (ethanol 70 / 140, gasoline 125 / 80), so each row here is pinned to 100 / burnRate and
# the JSON files in kubejs/data/createpropulsion/thruster_fuels carry the real numbers.
# The liquid burner reads the JSON thrust and this burn rate, so keep them equal.
#
# Per mB of thrust (thrust x efficiency / burn rate), checked against the US DOE AFDC fuel
# comparison chart (lower heating value, Btu per gallon):
#   diesel      128,488                       1.00 here (cdg/cdg_diesel.json, 1.0 / 100)
#   gasoline    112,114 to 116,090, mid 114,102   0.89 of diesel (114,102 / 128,488 = 0.888)
#                 cdg/cdg_gasoline.json 0.89 / 100                  = 0.89
#                 mic_petrochem_gasoline.json 0.89 / 0.9 vs mic diesel 1.0 / 0.9 = 0.989 vs 1.111
#   ethanol     76,330                        0.594 of diesel, 0.60 here (cdg_ethanol.json 0.8 / 120)
#   mic premium and cheap gasoline  same 0.89 / 0.9 as plain gasoline (0.989 per mB). Octane
#                 changes knock in a piston engine and does nothing for energy in a thruster.
#   biodiesel   119,550 (B100)                0.93 of diesel (cdg_biodiesel.json 0.93 / 100)
#   plant oil   about 0.90 of diesel          cdg_plant_oil.json 0.9 / 100 (no AFDC row for straight oil)
# The mic_petrochem gasoline JSON files here sit at the same path as the mod's own files, so they
# replace them. Move the values into the mod at its next release and delete the overrides.
["Fuel Configuration".fuelProperties.createdieselgenerators_diesel]
	efficiency = 100
	burnRate = 100

["Fuel Configuration".fuelProperties.createdieselgenerators_gasoline]
	efficiency = 100
	burnRate = 100

["Fuel Configuration".fuelProperties.createdieselgenerators_ethanol]
	efficiency = 100
	burnRate = 120

["Fuel Configuration".fuelProperties.createdieselgenerators_biodiesel]
	efficiency = 100
	burnRate = 100

["Fuel Configuration".fuelProperties.createdieselgenerators_plant_oil]
	efficiency = 100
	burnRate = 100
